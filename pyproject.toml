[project]
name = "omnilingual"
version = "0.1.0"
description = "Transcribe multilingual Indian-language meeting recordings to Markdown with English translation"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
omnilingual = "omnilingual.cli:app"
omnilingual-ui = "omnilingual.ui.__main__:main"

[project.optional-dependencies]
# Local on-device Whisper:
# - mlx-whisper is fastest on Apple Silicon (Metal).
# - faster-whisper (CTranslate2) is the CPU path for Intel Macs and Linux.
# - onnxruntime 1.24+ dropped the Intel-mac wheel; pin Intel macs to last
#   universal/x86_64 build so `uv sync --extra local-stt` resolves on
#   macosx_26_0_x86_64 (your Intel i9).
local-stt = [
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.0",
    "onnxruntime>=1.14,<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
# Speaker diarization via sherpa-onnx (pure ONNX runtime; works on Intel Macs).
# sherpa-onnx-core is listed explicitly even though sherpa-onnx already depends
# on it: uv's project resolver drops that transitive entry from uv.lock, so the
# core never gets installed and the three dylibs under sherpa_onnx/lib/ stay
# missing — which surfaces only at import time on macOS as "Library not loaded:
# @rpath/libonnxruntime.dylib". Requiring it directly puts it in the lock.
diarize = [
    "sherpa-onnx>=1.12,<2",
    "sherpa-onnx-core>=1.12,<2",
    "soundfile>=0.12",
]
# Local on-device IndicTrans2 translation (CTranslate2 int8, CPU, no GPU needed):
# - ctranslate2 has an Intel-mac wheel and pulls only numpy + pyyaml; it quantizes
#   the float32 checkpoint to int8 as it loads, which is what keeps the ~850 MB
#   download affordable on a 16 GB Intel Mac.
# - sentencepiece and huggingface-hub stand in for the model's own tokenizer code
#   and its download. The obvious alternative, transformers, needs torch (~2.5 GB)
#   for nothing else here, so it is deliberately left out.
# - The checkpoint is a community conversion (see config.DEFAULT_MT_MODELS); the
#   official ai4bharat one is gated and can only be converted with torch present.
local-mt = [
    "ctranslate2>=4.5",
    "sentencepiece>=0.2",
    "huggingface-hub>=0.27",
]
# Web UI dependencies (fastapi, uvicorn, pywebview).
# These are strictly optional — the CLI never acquires them so that
# `uv run omnilingual transcribe` never pulls in web dependencies.
ui = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pywebview>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omnilingual"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the real Sarvam API; needs SARVAM_API_KEY",
    "mlx: runs the real local Whisper model; needs the local-stt extra on Apple Silicon",
    "faster_whisper: runs the real local faster-whisper model; needs the local-stt extra",
    "diarize: runs the real local diarization models; needs the diarize extra",
]
